[project]
name = "sint-prospective-mcp"
version = "0.1.0"
description = "Prospective Memory MCP server — tracks intentions, suspended tasks, and context across sessions"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp[fastmcp]>=1.6.0",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prospective*"]
